name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.x"
          cache: true
      - run: go test ./...
      - run: go vet ./...

  tinygo-host:
    name: TinyGo host integration (linux/amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # klauspost/compress v1.20.1 requires Go 1.25; TinyGo 0.41.1
          # supports Go through 1.26, so pin the shared compatible toolchain.
          go-version: "1.26.1"
          cache: true
      - uses: acifani/setup-tinygo@db56321a62b9a67922bb9ac8f9d085e218807bb3 # v2
        with:
          tinygo-version: "0.41.1"
          install-binaryen: false
      - name: Install TinyGo native linker
        run: command -v ld.lld >/dev/null || (sudo apt-get update && sudo apt-get install -y lld)
      - name: Report pinned host toolchain
        run: |
          go version
          tinygo version
      - name: Execute TinyGo-hosted Wasm32, Memory64, and WasmGC plugin integration
        run: >-
          tinygo test -v
          -scheduler=tasks
          -gc=conservative
          -opt=z
          -no-debug
          -p=2
          -tags=noasm
          -run '^TestTinyGoHostIntegration$'
          .
