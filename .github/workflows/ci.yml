name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.x"
          cache: true
      - run: go test ./...
      - run: go vet ./...

  tinygo-host:
    name: TinyGo guest and host integration (linux/amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GOMAXPROCS: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.1"
          cache: true
      - uses: acifani/setup-tinygo@db56321a62b9a67922bb9ac8f9d085e218807bb3 # v2
        with:
          tinygo-version: "0.42.0"
          install-binaryen: false
      - name: Apply Wago-pinned TinyGo scheduler fix
        run: ./scripts/patch-tinygo-042.sh
      - name: Install TinyGo native linker
        run: command -v ld.lld >/dev/null || (sudo apt-get update && sudo apt-get install -y lld)
      - name: Report pinned TinyGo toolchain
        run: |
          go version
          tinygo version
      - name: Build genuine TinyGo Wasm32 guest
        run: >-
          tinygo build
          -target=wasm-unknown
          -no-debug
          -opt=z
          -o testdata/tinygo_guest.wasm
          ./testdata/tinygo_guest
      - name: Verify checked-in TinyGo guest is current
        run: git diff --exit-code -- testdata/tinygo_guest.wasm
      - name: Execute TinyGo guest in ordinary Go host
        run: go test -count=1 -v -run '^TestTinyGoGuestPackedABI$' .
      - name: Execute TinyGo guest and all ABIs in TinyGo-built host
        run: >-
          tinygo test -v
          -scheduler=tasks
          -gc=conservative
          -opt=z
          -no-debug
          -p=2
          -tags=noasm
          -count=1
          -run '^TestTinyGoHostIntegration$'
          .
